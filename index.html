<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スクリーンショットキャプチャー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
      color: #f0f0ff;
    }

    .subtitle {
      font-size: 13px;
      color: #6b6b88;
      margin-bottom: 32px;
    }

    .status-bar {
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #3a3a50;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.idle    { background: #3a3a50; }
    .status-dot.running { background: #22c55e; animation: pulse 1.5s infinite; }
    .status-dot.done    { background: #6366f1; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 13px;
      color: #8888aa;
    }

    .status-text strong { color: #c8c8e8; }

    .buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    button {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.03em;
    }

    #startBtn {
      background: #22c55e;
      color: #0a1a0f;
    }
    #startBtn:hover:not(:disabled) { background: #16a34a; transform: translateY(-1px); }
    #startBtn:disabled { background: #1e3a28; color: #2d5a3d; cursor: not-allowed; }

    #stopBtn {
      background: #ef4444;
      color: #fff;
    }
    #stopBtn:hover:not(:disabled) { background: #dc2626; transform: translateY(-1px); }
    #stopBtn:disabled { background: #2a1a1a; color: #5a2a2a; cursor: not-allowed; }

    .preview-section {
      display: none;
    }

    .preview-section.visible { display: block; }

    .preview-label {
      font-size: 12px;
      color: #6b6b88;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a3a transparent;
    }

    .preview-grid::-webkit-scrollbar { width: 4px; }
    .preview-grid::-webkit-scrollbar-track { background: transparent; }
    .preview-grid::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }

    .thumb-wrap {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      background: #12121a;
      border: 1px solid #2a2a3a;
      aspect-ratio: 16/9;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-num {
      position: absolute;
      bottom: 4px;
      right: 5px;
      background: rgba(0,0,0,0.7);
      color: #aaa;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .download-btn {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.03em;
    }

    .download-btn:hover { background: #4f46e5; transform: translateY(-1px); }
    .download-btn.visible { display: block; }

    .info {
      font-size: 12px;
      color: #4a4a62;
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }

    video {
      display: none;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>スクリーンショットキャプチャー</h1>
  <p class="subtitle">ブラウザ画面を 2.5 秒ごとに撮影し、PDF として保存します</p>

  <div class="status-bar">
    <div class="status-dot idle" id="statusDot"></div>
    <div class="status-text" id="statusText">待機中 — 開始ボタンを押してください</div>
  </div>

  <div class="buttons">
    <button id="startBtn">▶ 開始</button>
    <button id="stopBtn" disabled>■ 停止</button>
  </div>

  <div class="preview-section" id="previewSection">
    <div class="preview-label">キャプチャー済み <span id="countLabel">0</span> 枚</div>
    <div class="preview-grid" id="previewGrid"></div>
  </div>

  <button class="download-btn" id="downloadBtn">PDF をダウンロード</button>

  <div id="iframeWarning" style="display:none; background:#1e1a10; border:1px solid #5a4a10; border-radius:10px; padding:14px 16px; margin-top:4px;">
    <p style="font-size:13px; color:#c8a840; line-height:1.6; margin-bottom:10px;">
      ⚠️ このページはiframe内で実行されているため、画面共有APIが使用できません。<br>
      以下のボタンで単独タブとして開いてください。
    </p>
    <button onclick="window.open(location.href,'_blank')" style="width:100%;padding:10px;background:#c8a840;color:#1a1200;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;">
      新しいタブで開く ↗
    </button>
  </div>

  <p class="info">
    ※ 開始時に画面共有の許可を求められます。<br>
    ブラウザウィンドウまたはタブを選択してください。
  </p>
</div>

<video id="video" playsinline autoplay muted></video>
<canvas id="canvas"></canvas>

<script>
  const startBtn    = document.getElementById('startBtn');
  const stopBtn     = document.getElementById('stopBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusDot   = document.getElementById('statusDot');
  const statusText  = document.getElementById('statusText');
  const previewSection = document.getElementById('previewSection');
  const previewGrid = document.getElementById('previewGrid');
  const countLabel  = document.getElementById('countLabel');
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');

  let stream     = null;
  let intervalId = null;
  let screenshots = [];   // Array of { dataUrl, timestamp }

  // Detect iframe — getDisplayMedia is blocked inside iframes
  if (window.self !== window.top) {
    document.getElementById('iframeWarning').style.display = 'block';
    document.getElementById('startBtn').disabled = true;
    document.getElementById('statusText').innerHTML =
      'iframeでは画面共有が使用できません。新しいタブで開いてください。';
  }

  function setStatus(state, msg) {
    statusDot.className = 'status-dot ' + state;
    statusText.innerHTML = msg;
  }

  async function startCapture() {
    // Guard: getDisplayMedia requires top-level context
    if (window.self !== window.top) {
      setStatus('idle', 'iframeでは使用できません。新しいタブで開いてください。');
      return;
    }

    // Guard: API availability check
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      setStatus('idle', '⚠️ このブラウザは画面共有に対応していません（Chrome / Edge 推奨）');
      return;
    }

    screenshots = [];
    previewGrid.innerHTML = '';
    countLabel.textContent = '0';
    downloadBtn.classList.remove('visible');
    previewSection.classList.remove('visible');

    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: { ideal: 5, max: 10 } },
        audio: false
      });
    } catch (err) {
      if (err.name === 'NotAllowedError') {
        // On macOS, this often means screen recording permission is not granted
        setStatus('idle',
          'アクセスが拒否されました。<br>' +
          '<span style="font-size:11px;color:#6b6b88">' +
          'macOS の場合: システム設定 → プライバシーとセキュリティ → 画面収録 → ' +
          'ブラウザ（Chrome / Safari）をオンにしてから再試行してください。' +
          '</span>'
        );
      } else if (err.name === 'NotSupportedError') {
        setStatus('idle', '⚠️ HTTPSまたはlocalhost環境が必要です');
      } else if (err.name === 'AbortError') {
        setStatus('idle', 'キャンセルされました — 再度「開始」を押して共有を許可してください');
      } else {
        setStatus('idle', `エラー: ${err.message || err.name}`);
      }
      return;
    }

    video.srcObject = stream;
    await new Promise(resolve => { video.onloadedmetadata = resolve; });
    video.play();

    // Detect if stream ended externally (user stopped share)
    stream.getVideoTracks()[0].addEventListener('ended', () => {
      if (intervalId) stopCapture();
    });

    startBtn.disabled = true;
    stopBtn.disabled  = false;
    previewSection.classList.add('visible');
    setStatus('running', '<strong>撮影中</strong> — 2.5 秒ごとにキャプチャーしています');

    takeShot(); // take immediately
    intervalId = setInterval(takeShot, 2500);
  }

  function takeShot() {
    if (!video.videoWidth) return;

    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
    const ts = new Date().toLocaleTimeString('ja-JP');
    screenshots.push({ dataUrl, timestamp: ts });

    addThumb(dataUrl, screenshots.length);
    countLabel.textContent = screenshots.length;
  }

  function addThumb(dataUrl, n) {
    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';

    const img = document.createElement('img');
    img.src = dataUrl;
    wrap.appendChild(img);

    const num = document.createElement('div');
    num.className = 'thumb-num';
    num.textContent = n;
    wrap.appendChild(num);

    previewGrid.appendChild(wrap);
    previewGrid.scrollTop = previewGrid.scrollHeight;
  }

  function stopCapture() {
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;

    startBtn.disabled = false;
    stopBtn.disabled  = true;

    const n = screenshots.length;
    if (n === 0) {
      setStatus('idle', 'キャプチャーなし — 撮影前に停止されました');
      return;
    }

    setStatus('done', `<strong>停止</strong> — ${n} 枚を撮影しました。PDF を生成できます`);
    downloadBtn.classList.add('visible');
  }

  async function buildPdf() {
    if (screenshots.length === 0) return;

    downloadBtn.disabled = true;
    downloadBtn.textContent = 'PDF 生成中…';
    setStatus('done', 'PDF を生成しています…');

    await new Promise(resolve => setTimeout(resolve, 50));

    const { jsPDF } = window.jspdf;

    // Use first image to determine orientation
    const first = await loadImage(screenshots[0].dataUrl);
    const landscape = first.width > first.height;
    const pdf = new jsPDF({
      orientation: landscape ? 'landscape' : 'portrait',
      unit: 'px',
      format: [first.width, first.height]
    });

    for (let i = 0; i < screenshots.length; i++) {
      const { dataUrl, timestamp } = screenshots[i];
      const img = await loadImage(dataUrl);
      const pw = pdf.internal.pageSize.getWidth();
      const ph = pdf.internal.pageSize.getHeight();

      if (i > 0) pdf.addPage([img.width, img.height], img.width > img.height ? 'landscape' : 'portrait');

      // Scale to fit page
      const ratio = Math.min(pw / img.width, ph / img.height);
      const dw = img.width  * ratio;
      const dh = img.height * ratio;
      const dx = (pw - dw) / 2;
      const dy = (ph - dh) / 2;

      pdf.addImage(dataUrl, 'JPEG', dx, dy, dw, dh);

      // Timestamp watermark
      pdf.setFontSize(9);
      pdf.setTextColor(160, 160, 180);
      pdf.text(`${i + 1} / ${screenshots.length}  ${timestamp}`, 6, ph - 5);
    }

    const dateStr = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    pdf.save(`screenshots_${dateStr}.pdf`);

    downloadBtn.disabled = false;
    downloadBtn.textContent = 'PDF をダウンロード';
    setStatus('done', `PDF を保存しました（${screenshots.length} 枚）`);
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  startBtn.addEventListener('click', startCapture);
  stopBtn.addEventListener('click', stopCapture);
  downloadBtn.addEventListener('click', buildPdf);
</script>
</body>
</html>
